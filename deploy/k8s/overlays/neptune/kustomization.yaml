apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memory-worlds
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: falkordb
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: falkordb
      $patch: delete
  - target:
      kind: Service
      name: falkordb
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: falkordb
      $patch: delete
  - target:
      kind: NetworkPolicy
      name: graph
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: graph
      $patch: delete
  - target:
      kind: StatefulSet
      name: memory-worlds
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: memory-worlds
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: MEMORY_WORLDS_GRAPH_BACKEND
                    value: neptune
                  - name: MEMORY_WORLDS_FALKORDB_HOST
                    $patch: delete
                  - name: MEMORY_WORLDS_FALKORDB_PORT
                    $patch: delete
                  - name: MEMORY_WORLDS_FALKORDB_PASSWORD
                    $patch: delete
