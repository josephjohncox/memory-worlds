apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memory-worlds
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: falkordb
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: falkordb
      $patch: delete
  - target:
      kind: Service
      name: falkordb
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: falkordb
      $patch: delete
  - target:
      kind: NetworkPolicy
      name: graph
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: graph
      $patch: delete
  - target:
      kind: StatefulSet
      name: memory-worlds
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEMORY_WORLDS_GRAPH_BACKEND
          value: neptune
