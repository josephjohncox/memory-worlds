apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memory-worlds
resources:
  - ../graph
patches:
  - target:
      kind: StatefulSet
      name: memory-worlds
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEMORY_WORLDS_MOUNTS_FILE
          value: /config/mounts.json
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: mounts
          mountPath: /config
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: remote-tokens
          mountPath: /secrets/remotes
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: mounts
          secret:
            secretName: memory-worlds-mounts
            defaultMode: 288
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: remote-tokens
          secret:
            secretName: memory-worlds-remote-tokens
            defaultMode: 288
