apiVersion: v1
kind: Service
metadata:
  name: memory-worlds
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-worlds
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memory-worlds
spec:
  serviceName: memory-worlds
  # SQLite WAL has one daemon owner on one local/block-backed filesystem.
  # Scaling requires a different source/control store, not a shared RWX volume.
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-worlds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-worlds
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: memory-worlds:local
          imagePullPolicy: IfNotPresent
          args: [serve, --host, 0.0.0.0, --allow-network]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: MEMORY_WORLDS_DATA_DIR
              value: /data/memory
            - name: GRAPHITI_TELEMETRY_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: memory-worlds-runtime
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
