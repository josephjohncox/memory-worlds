apiVersion: v1
kind: Service
metadata:
  name: falkordb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
spec:
  serviceName: falkordb
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falkordb
          image: falkordb/falkordb-server:6.0.0@sha256:09928c7f8335147f13eec1d686e10a5a9a5a53f2e6df520f2847f94cb7e14925
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              case "$REDISCLI_AUTH" in
                *[!0-9a-fA-F]*) echo 'Invalid database credential format' >&2; exit 1 ;;
              esac
              [ "${#REDISCLI_AUTH}" -eq 64 ] || exit 1
              mkdir -p /data/graph
              {
                printf '%s\n' 'protected-mode yes' 'dir /data/graph' \
                  'loadmodule /var/lib/falkordb/bin/falkordb.so' \
                  'appendonly yes' 'appendfsync everysec' 'save 900 1'
                printf 'requirepass %s\n' "$REDISCLI_AUTH"
              } > /run/memory-worlds/redis.conf
              exec redis-server /run/memory-worlds/redis.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: memory-worlds-falkordb
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /run/memory-worlds
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
