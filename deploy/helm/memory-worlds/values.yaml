# SQLite requires one daemon. PostgreSQL supports multiple fenced API workers.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: memory-worlds
  tag: local
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
runtime:
  # Operator-created Secret containing explicit extraction/embedding provider settings.
  existingSecret: ""
organization:
  # Optional operator-owned identity, spaces, roles and group configuration.
  existingConfigMap: ""
  configKey: organization.toml
graph:
  # Graphiti is the normal memory engine; disabled is for maintenance/recovery only.
  backend: falkordb
storage:
  backend: sqlite
  postgres:
    # URL is secret data; use postgresql+psycopg:// with TLS in production.
    existingSecret: ""
    urlKey: database-url
    # Stable UUID shared by all replicas of this authority.
    authorityId: ""
    # Optional existing Secret holding the current RDS/PostgreSQL trust bundle.
    caExistingSecret: ""
    caKey: ca.pem
persistence:
  # Empty storageClass uses the cluster default; "-" explicitly uses no class.
  storageClass: ""
  size: 10Gi
  existingClaim: ""
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {cpu: "2", memory: 2Gi}
nodeSelector: {}
tolerations: []
affinity: {}
falkordb:
  enabled: true
  replicaCount: 1
  image:
    repository: falkordb/falkordb-server
    tag: 6.0.0
    digest: sha256:09928c7f8335147f13eec1d686e10a5a9a5a53f2e6df520f2847f94cb7e14925
    pullPolicy: IfNotPresent
  auth:
    # Create this Secret before installation; password is 64 random hex characters.
    existingSecret: memory-worlds-falkordb
    passwordKey: password
  persistence:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
router:
  enabled: false
  # Secret keys include mounts.json and the token filenames referenced therein.
  mountsExistingSecret: ""
  tokensExistingSecret: ""
backup:
  enabled: false
  # API artifact directory; multiple PostgreSQL replicas need a shared RWX claim.
  existingClaim: ""
  keyExistingSecret: ""
  keyKey: key
  cronJob:
    enabled: false
    schedule: "0 3 * * *"
    timeZone: Etc/UTC
    suspend: false
    # Separate destination claim for downloaded encrypted archives.
    outputExistingClaim: ""
    adminTokenExistingSecret: ""
    adminTokenKey: token
    graphMode: native
    activeDeadlineSeconds: 1800
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: "2", memory: 2Gi}
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    # A live administrator token is required by /metrics.
    existingSecret: ""
    tokenKey: token
  prometheusRule:
    enabled: false
    labels: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
networkPolicy:
  enabled: true
  # Both selectors must match a trusted gateway/client pod.
  clientNamespaceSelector:
    matchLabels: {memory-worlds-client: "true"}
  clientPodSelector:
    matchLabels: {memory-worlds-client: "true"}
  # Explicit opt-in for model/OIDC/remote HTTPS; narrow CIDRs in production.
  allowExternalHTTPS: false
  externalHTTPSCIDRs: [0.0.0.0/0, "::/0"]
  # Standard NetworkPolicy peers/ports for local models or private Neptune.
  extraAPIEgress: []
  # Required explicit database peers/ports for the PostgreSQL profile.
  postgresEgress: []
  metricsNamespaceSelector:
    matchLabels: {memory-worlds-metrics: "true"}
  metricsPodSelector:
    matchLabels: {memory-worlds-metrics: "true"}
tests:
  enabled: true
