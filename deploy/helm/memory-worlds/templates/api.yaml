{{- include "memory-worlds.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memory-worlds.fullname" . | quote }}
  labels:
    {{- include "memory-worlds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "memory-worlds.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
{{- if eq .Values.storage.backend "postgres" }}
kind: Deployment
{{- else }}
kind: StatefulSet
{{- end }}
metadata:
  name: {{ include "memory-worlds.fullname" . | quote }}
  labels:
    {{- include "memory-worlds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if eq .Values.storage.backend "sqlite" }}
  serviceName: {{ include "memory-worlds.fullname" . | quote }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "memory-worlds.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "memory-worlds.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "memory-worlds.serviceAccountName" . | quote }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "memory-worlds.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, --host, 0.0.0.0, --allow-network]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: MEMORY_WORLDS_DATA_DIR
              value: /data/memory
            - name: GRAPHITI_TELEMETRY_ENABLED
              value: "false"
            - name: MEMORY_WORLDS_GRAPH_BACKEND
              value: {{ .Values.graph.backend | quote }}
            - name: MEMORY_WORLDS_STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: MEMORY_WORLDS_DATABASE_URL
              {{- if eq .Values.storage.backend "postgres" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.postgres.urlKey | quote }}
              {{- else }}
              value: ""
              {{- end }}
            - name: MEMORY_WORLDS_AUTHORITY_ID
              value: {{ if eq .Values.storage.backend "postgres" }}{{ .Values.storage.postgres.authorityId | quote }}{{ else }}""{{ end }}
            {{- if and (eq .Values.storage.backend "postgres") .Values.storage.postgres.caExistingSecret }}
            - name: PGSSLROOTCERT
              value: /secrets/postgres/ca.pem
            {{- end }}
            - name: MEMORY_WORLDS_BACKUP_DIRECTORY
              value: {{ if .Values.backup.enabled }}"/backups"{{ else }}""{{ end }}
            - name: MEMORY_WORLDS_BACKUP_KEY_FILE
              value: {{ if .Values.backup.enabled }}"/secrets/backup/key"{{ else }}""{{ end }}
            {{- if eq .Values.graph.backend "falkordb" }}
            - name: MEMORY_WORLDS_FALKORDB_HOST
              value: {{ include "memory-worlds.fullname" . }}-falkordb
            - name: MEMORY_WORLDS_FALKORDB_PORT
              value: "6379"
            - name: MEMORY_WORLDS_FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.falkordb.auth.existingSecret | quote }}
                  key: {{ .Values.falkordb.auth.passwordKey | quote }}
            {{- end }}
            {{- if .Values.router.enabled }}
            - name: MEMORY_WORLDS_MOUNTS_FILE
              value: /config/mounts.json
            {{- end }}
          {{- if .Values.runtime.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtime.existingSecret | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- if and (eq .Values.storage.backend "postgres") .Values.storage.postgres.caExistingSecret }}
            - {name: postgres-ca, mountPath: /secrets/postgres/ca.pem, subPath: ca.pem, readOnly: true}
            {{- end }}
            {{- if .Values.backup.enabled }}
            - {name: backups, mountPath: /backups}
            - {name: backup-key, mountPath: /secrets/backup/key, subPath: key, readOnly: true}
            {{- end }}
            {{- if .Values.router.enabled }}
            - {name: mounts, mountPath: /config, readOnly: true}
            - {name: remote-tokens, mountPath: /secrets/remotes, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if and (eq .Values.storage.backend "postgres") .Values.storage.postgres.caExistingSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.storage.postgres.caExistingSecret | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.storage.postgres.caKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if eq .Values.storage.backend "postgres" }}
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- end }}
        {{- if .Values.backup.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.existingClaim | quote }}
        - name: backup-key
          secret:
            secretName: {{ .Values.backup.keyExistingSecret | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.backup.keyKey | quote }}
                path: key
        {{- end }}
        {{- if .Values.router.enabled }}
        - name: mounts
          secret:
            secretName: {{ .Values.router.mountsExistingSecret | quote }}
            defaultMode: 288
        - name: remote-tokens
          secret:
            secretName: {{ .Values.router.tokensExistingSecret | quote }}
            defaultMode: 288
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and (eq .Values.storage.backend "sqlite") (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ if eq .Values.persistence.storageClass "-" }}""{{ else }}{{ .Values.persistence.storageClass | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
