name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14.8", "3.15.0"]
    env:
      MEMORY_WORLDS_PYTHON: ${{ matrix.python }}
      MEMORY_WORLDS_RUN_FALKORDB_TEST: "1"
      MEMORY_WORLDS_TEST_FALKORDB_PORT: "16379"
      MEMORY_WORLDS_TEST_POSTGRES_DSN_FILE: /tmp/memory-worlds-ci/postgres.dsn
      MEMORY_WORLDS_TEST_FALKOR_RECOVERY_FILE: /tmp/memory-worlds-ci/falkor-recovery.json
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:ed9475dab2438f7a8ee063fa29a0740e7fbf7185e5549db1866eb722f12b49f8
        env:
          POSTGRES_USER: memory_worlds_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: memory_worlds_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U memory_worlds_test -d memory_worlds_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      falkordb:
        image: falkordb/falkordb-server:6.0.0@sha256:09928c7f8335147f13eec1d686e10a5a9a5a53f2e6df520f2847f94cb7e14925
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      falkordb-recovery:
        image: falkordb/falkordb-server:6.0.0@sha256:09928c7f8335147f13eec1d686e10a5a9a5a53f2e6df520f2847f94cb7e14925
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Check Python with the real graph backend
        shell: bash
        run: |
          install -d -m 700 /tmp/memory-worlds-ci
          mise exec -- python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/memory-worlds-ci')
          fixtures = {
              'postgres.dsn': 'postgresql+psycopg://memory_worlds_test:isolated-ci-only@127.0.0.1:15432/memory_worlds_test',
              'falkor-recovery.json': json.dumps([{'host': '127.0.0.1', 'port': 16379}, {'host': '127.0.0.1', 'port': 16380}]),
          }
          for name, content in fixtures.items():
              descriptor = os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'w') as output:
                  output.write(content)
          PY
          mise run python:check
      - name: Exercise owned local setup with real Graphiti and local model emulators
        if: matrix.python == '3.15.0'
        run: mise run setup:smoke
      - name: Build source archive and wheel
        run: mise run python:build
      - name: Audit public distribution contents
        env:
          PUBLIC_CONTENT_DENY_PATTERN: ${{ vars.PUBLIC_CONTENT_DENY_PATTERN }}
        run: mise run artifacts:audit --python-only dist

  pi:
    name: Native Pi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv node"
      - name: Type check and test native hooks
        run: mise run pi:verify
      - name: Exercise the real Pi runtime
        run: mise run pi:smoke
      - name: Audit native package contents
        run: |
          mkdir -p /tmp/memory-worlds-pi-package
          mise run pi:pack --json --pack-destination /tmp/memory-worlds-pi-package > /tmp/memory-worlds-pi-pack.json
          mise exec -- python - <<'PYTHON'
          import json
          from pathlib import Path, PurePosixPath
          result = json.loads(Path("/tmp/memory-worlds-pi-pack.json").read_text())[0]
          paths = {file["path"] for file in result["files"]}
          assert {"package.json", "README.md", "LICENSE", "dist/extension.js"} <= paths
          for path in paths:
              parts = PurePosixPath(path).parts
              assert parts[0] in {"dist", "package.json", "README.md", "LICENSE"}, path
              assert not {"node_modules", ".git", ".env"}.intersection(parts), path
          assert Path("packages/pi/LICENSE").read_bytes() == Path("LICENSE").read_bytes()
          print("Native package contains compiled extension/client, documentation and Apache-2.0 license")
          PYTHON

  helm:
    name: Helm deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Validate profiles and rejected unsafe values
        run: mise run helm:check

  kind:
    name: Kubernetes persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Deploy and verify pod replacement and Helm lifecycle
        run: mise run kind:smoke
