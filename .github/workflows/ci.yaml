name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14.8", "3.15.0"]
    env:
      MEMORY_WORLDS_PYTHON: ${{ matrix.python }}
      MEMORY_WORLDS_RUN_FALKORDB_TEST: "1"
      MEMORY_WORLDS_TEST_FALKORDB_PORT: "16379"
    services:
      falkordb:
        image: falkordb/falkordb-server:6.0.0@sha256:09928c7f8335147f13eec1d686e10a5a9a5a53f2e6df520f2847f94cb7e14925
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Check Python with the real graph backend
        run: mise run python:check
      - name: Build source archive and wheel
        run: mise run python:build
      - name: Audit public distribution contents
        env:
          PUBLIC_CONTENT_DENY_PATTERN: ${{ vars.PUBLIC_CONTENT_DENY_PATTERN }}
        run: mise run artifacts:audit --python-only dist

  pi:
    name: Native Pi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv node"
      - name: Type check and test native hooks
        run: mise run pi:verify
      - name: Exercise the real Pi runtime
        run: mise run pi:smoke
      - name: Audit native package contents
        run: |
          mkdir -p /tmp/memory-worlds-pi-package
          mise run pi:pack --json --pack-destination /tmp/memory-worlds-pi-package > /tmp/memory-worlds-pi-pack.json
          mise exec -- python - <<'PYTHON'
          import json
          from pathlib import Path, PurePosixPath
          result = json.loads(Path("/tmp/memory-worlds-pi-pack.json").read_text())[0]
          paths = {file["path"] for file in result["files"]}
          assert {"package.json", "README.md", "LICENSE", "dist/extension.js"} <= paths
          for path in paths:
              parts = PurePosixPath(path).parts
              assert parts[0] in {"dist", "package.json", "README.md", "LICENSE"}, path
              assert not {"node_modules", ".git", ".env"}.intersection(parts), path
          assert Path("packages/pi/LICENSE").read_bytes() == Path("LICENSE").read_bytes()
          print("Native package contains compiled extension/client, documentation and Apache-2.0 license")
          PYTHON

  helm:
    name: Helm deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Validate profiles and rejected unsafe values
        run: mise run helm:check

  kind:
    name: Kubernetes persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Deploy and verify pod replacement and Helm lifecycle
        run: mise run kind:smoke
