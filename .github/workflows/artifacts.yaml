name: Artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Versioned distributions
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv node"
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mise exec -- python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the package version")
          PY
      - name: Build and audit all distributions
        env:
          PUBLIC_CONTENT_DENY_PATTERN: ${{ vars.PUBLIC_CONTENT_DENY_PATTERN }}
        run: mise run artifacts:build --require-clean --source-sha "$GITHUB_SHA"
      - name: Upload private workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-worlds-${{ github.sha }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  container:
    name: Verified private container
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'josephjohncox/memory-worlds' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/josephjohncox/memory-worlds
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install locked mise tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.17"
          cache: false
          install_args: "python uv"
      - name: Audit tracked inputs and validate image references
        id: references
        env:
          PUBLIC_CONTENT_DENY_PATTERN: ${{ vars.PUBLIC_CONTENT_DENY_PATTERN }}
        run: |
          mise run artifacts:source
          mise run artifacts:check --require-clean --source-sha "$SOURCE_SHA"
          mise exec -- python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          sha = os.environ["SOURCE_SHA"]
          branch = os.environ["SOURCE_BRANCH"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"[a-f0-9]{40}", sha):
              raise SystemExit("Expected the full tested source commit")
          tags = [f"{os.environ['IMAGE']}:sha-{sha}"]
          if branch != "main":
              if branch != f"v{version}":
                  raise SystemExit("Release tag must match all package versions")
              tags.append(f"{os.environ['IMAGE']}:{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tags=" + ",".join(tags) + "\n")
          PY
      - name: Require private repository and package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise exec -- python - <<'PY'
          import json, os, urllib.error, urllib.request
          def get(path):
              request = urllib.request.Request("https://api.github.com/" + path, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          repository_path = "repos/" + os.environ["GITHUB_REPOSITORY"]
          if get(repository_path)["private"] is not True:
              raise SystemExit("Private container publication requires a private repository")
          run = get(repository_path + "/actions/runs/" + os.environ["CI_RUN_ID"])
          if run.get("path") != ".github/workflows/ci.yaml" or run.get("head_sha") != os.environ["SOURCE_SHA"] or run.get("conclusion") != "success" or run.get("event") != "push":
              raise SystemExit("The required CI workflow did not pass at this exact commit")
          branch = os.environ["SOURCE_BRANCH"]
          if branch != "main":
              reference = get(repository_path + "/git/ref/tags/" + branch)["object"]
              for _ in range(8):
                  if reference["type"] != "tag":
                      break
                  reference = get(repository_path + "/git/tags/" + reference["sha"])["object"]
              if reference["type"] != "commit" or reference["sha"] != os.environ["SOURCE_SHA"]:
                  raise SystemExit("Release publication requires an actual tag at the tested commit")
          try:
              package = get("users/josephjohncox/packages/container/memory-worlds")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Cannot verify package visibility: HTTP {error.code}") from error
              print("Package does not exist or is inaccessible; first GHCR publication defaults to private")
          else:
              if package.get("visibility") != "private":
                  raise SystemExit("Refusing to publish into an existing non-private package")
              print("Existing package visibility: private")
          PY
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the tested source
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.references.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Memory Worlds
            org.opencontainers.image.source=https://github.com/josephjohncox/memory-worlds
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=min
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify private package and record immutable image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.references.outputs.tags }}
        run: |
          mise exec -- python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          request = urllib.request.Request("https://api.github.com/users/josephjohncox/packages/container/memory-worlds", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(request, timeout=30) as response:
              package = json.load(response)
          if package.get("visibility") != "private":
              raise SystemExit("Published package privacy could not be verified")
          digest = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Build did not return a valid immutable image digest")
          Path("container-receipt.json").write_text(json.dumps({"schema_version": 1, "source_commit": os.environ["SOURCE_SHA"], "image": os.environ["IMAGE"], "digest": digest, "tags": os.environ["IMAGE_TAGS"].split(","), "visibility": "private", "platforms": ["linux/amd64", "linux/arm64"]}, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Private image: `{os.environ['IMAGE']}@{digest}`\n")
          print("Verified GHCR package visibility: private")
          PY
      - name: Upload image receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-worlds-container-${{ env.SOURCE_SHA }}
          path: container-receipt.json
          if-no-files-found: error
          retention-days: 30
