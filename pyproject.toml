[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "memory-worlds"
version = "0.3.0"
description = "Local shared agent memory with explicit worlds and portable evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.16"
dependencies = [
  "fastapi>=0.156.4,<1",
  "uvicorn>=0.54,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.14.1,<3",
  "PyJWT[crypto]>=2.15.1,<3",
  "graphiti-core[falkordb]==0.31.2",
  "SQLAlchemy>=2.1.5,<2.2",
  "psycopg[binary]==3.3.6",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
neptune = ["graphiti-core[neptune]==0.31.2"]
mcp = ["mcp>=2.3,<3"]
langgraph = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langsmith==0.14.12",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17.1,<1", "PyYAML>=6.0.3,<7"]

[project.scripts]
memory-worlds = "memory_worlds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_worlds"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/src", "/tests", "/docs", "/deploy", "/scripts", "/examples", "/packages/pi/src", "/packages/pi/test",
  "/packages/pi/package.json", "/packages/pi/package-lock.json", "/packages/pi/tsconfig.json",
  "/packages/pi/README.md", "/packages/pi/LICENSE", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock",
  "/packages/opencode/src", "/packages/opencode/test", "/packages/opencode/package.json",
  "/packages/opencode/package-lock.json", "/packages/opencode/tsconfig.json",
  "/packages/opencode/README.md", "/packages/opencode/LICENSE", "/plugins",
  "/.env.example", "/.python-version", "/.dockerignore", "/.gitignore",
  "/mise.toml", "/mise.lock", "/tasks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

